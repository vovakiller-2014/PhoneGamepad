 f.push(['rng','w','w',5,70,1],['col','c','c'],['chk','rgb','rgb'],['rng','rgbs','rgbs',1,10,1]);return f}
function ctl(e,[ty,k,l,a,b,s]){const v=e[k],n=t(l);
 if(ty=='rng')return`<label class=pr><span>${n}</span><input type=range min=${a} max=${b} step=${s} value=${v} oninput="upd('${k}',+this.value);this.nextElementSibling.textContent=this.value"><b>${v}</b></label>`;
 if(ty=='chk')return`<label class=pr2><span>${n}</span><input type=checkbox ${v?'checked':''} onchange="upd('${k}',+this.checked)"></label>`;
 if(ty=='txt')return`<label class=pr2><span>${n}</span><input value="${esc(v)}" oninput="upd('${k}',this.value)"></label>`;
 if(ty=='col')return`<label class=pr2><span>${n}</span><input type=color value="${v}" oninput="upd('${k}',this.value)"></label>`;
 return`<label class=pr2><span>${n}</span><select onchange="upd('${k}',isNaN(this.value)?this.value:+this.value)">${a.map((x,i)=>`<option value="${x}" ${x==v?'selected':''}>${b?b[i]:x}</option>`).join('')}</select></label>`}
function bar(){const b=$('#eb'),e=ED.sel,tp=e&&e.y<22;b.hidden=false;b.style.top=tp?'auto':'0';b.style.bottom=tp?'0':'auto';
 let h=`<input value="${esc(dn(ED.p))}" size=9 oninput="ED.p.name=this.value;delete ED.p.nk"><select id=at>${['btn','stick','wheel','tilt','slider'].map(x=>`<option value=${x}>${t(x)}</option>`).join('')}</select><button onclick=addE()>＋</button>`;
 if(e)h+=`<button onclick=dupE()>⧉</button><button onclick=delE()>🗑</button>`;
 h+=`<button class="${ED.snap?'sv':''}" onclick=snapT()>▦</button><button class=sv onclick=saveE()>${t('save')}</button><button onclick=home()>✕</button>`+(ED.p.nk?`<button onclick=rstE()>${t('rst')}</button>`:`<button onclick=delP()>${t('del')}</button>`);b.innerHTML=h;
 const p=$('#ep');if(!e){p.hidden=true;return}p.hidden=false;p.style.top=tp?'8px':'54px';p.style.left=e.x<50?'auto':'8px';p.style.right=e.x<50?'8px':'auto';
 p.innerHTML=flds(e).map(f=>ctl(e,f)).join('')+(e.t=='wheel'?`<div class=pre>${[0,1,2].map(i=>`<button onclick=preset(${i})>${t('p'+i)}</button>`).join('')}</div>`:'');
 document.querySelectorAll('.el.sel').forEach(x=>x.classList.remove('sel'));RT[e.id].d.classList.add('sel')}
function upd(f,v){const e=ED.sel;e[f]=v;if(f=='k'||f=='tx'||f=='or'){render(ED.p,true);bar()}else{const R=RT[e.id];if(f=='l')R.d.textContent=v;else R.sz()}}
function preset(i){Object.assign(ED.sel,PRE[i]);bar()}
function snapT(){ED.snap=ED.snap?0:1;bar()}
function newEl(ty){const e={id:U(),t:ty,k:ty=='btn'?'A':'L',l:ty=='btn'?'●':'',x:50,y:50,w:{btn:11,stick:26,wheel:36,tilt:20,slider:40}[ty],c:'#dddddd',p1:0};
 if(ty=='wheel')Object.assign(e,PRE[1]);if(ty=='tilt')Object.assign(e,{p1:35,sm:25,dz:3,cv:20});if(ty=='slider')Object.assign(e,{sm:20});return norm1(e)}
function addE(){const e=newEl($('#at').value);ED.p.els.push(e);ED.sel=e;render(ED.p,true);bar()}
function dupE(){const c=JSON.parse(JSON.stringify(ED.sel));c.id=U();c.x=cl(c.x+4,0,100);c.y=cl(c.y+4,0,100);ED.p.els.push(c);ED.sel=c;render(ED.p,true);bar()}
function delE(){ED.p.els=ED.p.els.filter(x=>x!=ED.sel);ED.sel=null;render(ED.p,true);bar()}
function saveE(){const i=S.profs.findIndex(x=>x.id==ED.id);S.profs[i]=ED.p;save();home()}
function rstE(){ED.p=DEFS().find(x=>x.id==ED.id);ED.sel=null;render(ED.p,true);bar()}
function delP(){S.profs=S.profs.filter(x=>x.id!=ED.id);if(S.cur==ED.id)S.cur='ps';save();home()}
function newP(){const m=$('#cm');m.hidden=false;m.innerHTML=`<div class=mb><div class=tabs><b style="flex:1">${t('pick')}</b><button class=pb onclick=cm(0)>✕</button></div><button class="pb big" onclick=mkP(0)>Xbox</button><button class="pb big" onclick=mkP(1)>PlayStation</button><button class="pb big" onclick=mkP(2)>Custom · ${t('empty')}</button></div>`}
function mkP(i){const n=S.profs.filter(p=>!p.nk).length+1,p={id:U(),name:(i==2?'Custom ':i?'PS ':'Xbox ')+n,els:i==2?[]:lay(i?PS:XB,i,'stick')};S.profs.push(p);save();cm(0);edit(p.id)}
function bk(){const m=$('#cm');m.hidden=false;m.innerHTML=`<div class=mb><div class=tabs><b style="flex:1">${t('bkp')}</b><button class=pb onclick=cm(0)>✕</button></div><textarea id=bt rows=6 style="width:100%;background:#111;color:#ddd;border:1px solid #444;border-radius:8px;font-size:11px">${esc(JSON.stringify(S.profs))}</textarea><div style="margin-top:8px"><button class="pb on" onclick="A&&A.share($('#bt').value)">${t('share')}</button><button class=pb onclick=imp()>${t('imp')}</button></div><div id=ms></div></div>`}
function imp(){try{const p=JSON.parse($('#bt').value);if(!Array.isArray(p)||!p.every(x=>x.id&&Array.isArray(x.els)))throw 0;p.forEach(norm);S.profs=p;save();cm(0);home()}catch(e){msg(t('fail'))}}
/* ---- connection ---- */
function msg(s){const m=$('#ms');if(m)m.textContent=s}
function closeLink(){if(ws){const w=ws;ws=null;w.close()}if(A)A.btClose();clearInterval(hb);link={kind:'',send(){}}}
function conn(){if(link.kind){closeLink();home();return}cm(1)}
function cm(on){const m=$('#cm');m.hidden=!on;if(!on)return;
 m.innerHTML=`<div class=mb><div class=tabs><button class="pb ${tab=='wifi'?'on':''}" onclick="tab='wifi';cm(1)">Wi-Fi</button><button class="pb ${tab=='bt'?'on':''}" onclick="tab='bt';cm(1)">Bluetooth</button><button class=pb onclick=cm(0)>✕</button></div><div id=mc></div><div id=ms></div></div>`;
 if(tab=='wifi')$('#mc').innerHTML=`<input id=ip placeholder="IP" value="${esc(S.ip)}"><input id=pn placeholder=PIN inputmode=numeric value="${esc(S.pin)}"><button class="pb on" onclick=goW()>${t('go')}</button>${A?`<button class=pb onclick=A.scanQr()>${t('scan')}</button>`:''}`;
 else btList()}
function btList(){const r=A?A.btDevices():'[]',s=$('#mc'),rf=`<button class=pb onclick=cm(1)>↻</button>`;
 if(r=='NOPERM')return s.innerHTML=`<p>${t('noperm')}</p>${rf}`;if(r=='OFF')return s.innerHTML=`<p>${t('btoff')}</p>${rf}`;
 const d=JSON.parse(r);s.innerHTML=d.length?d.map(x=>`<button class=pb onclick="btc('${x.a}')">${esc(x.n)}</button>`).join(''):`<p>${t('nodev')}</p>${rf}`}
function btc(a){closeLink();A.btConnect(a);msg('…')}
function goW(){S.ip=$('#ip').value.trim();S.pin=$('#pn').value.trim();save();wifi(S.ip,S.pin)}
function wifi(host,pin){closeLink();const t0=Date.now();let w;try{w=ws=new WebSocket(`ws://${host.includes(':')?host:host+':8080'}/ws?pin=${pin}`)}catch(e){return msg(t('fail'))}
 w.onopen=()=>{link={kind:'wifi',send:o=>w.readyState==1&&w.send(JSON.stringify(o))};cm(0);if(view=='home')home()};
 w.onclose=()=>{if(ws!==w)return;const was=link.kind=='wifi';link={kind:'',send(){}};ws=null;if(was&&Date.now()-t0<1500)cm(1);msg(t('fail'));if(view=='home')home()}}
window.onLink=k=>{clearInterval(hb);if(k=='bt'){link={kind:'bt',send:o=>A.btSend(JSON.stringify(o))};hb=setInterval(()=>send({t:'hb',k:''}),1000);cm(0)}else{link={kind:'',send(){}};if(!$('#cm').hidden)msg(t('fail'))}if(view=='home')home()};
window.onQr=u=>{try{const x=new URL(u);S.ip=x.host;S.pin=x.searchParams.get('pin')||'';save();tab='wifi';cm(1);wifi(S.ip,S.pin)}catch(e){msg(t('fail'))}};
window.onBack=()=>{if(!$('#cm').hidden)cm(0);else if(view!='home')home();else if(A)A.exit()};
home();
</script></body></html>
