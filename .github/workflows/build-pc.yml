name: Build PC exe
on:
  push:
    branches: [PCApp]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install vgamepad aiohttp "qrcode[pil]" pyinstaller
      - run: pyinstaller --onefile --noconsole --name PhoneGamepad --add-data "index.html;." --collect-all vgamepad pcapp.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGamepad-exe
          path: dist/PhoneGamepad.exe
